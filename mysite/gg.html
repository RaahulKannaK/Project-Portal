{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coordinator Hub - Dashboard</title>

  <!-- ✅ PWA -->
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <meta name="theme-color" content="#3730A3">

  <!-- ✅ iOS support -->
  <link rel="apple-touch-icon" href="https://res.cloudinary.com/dmwwhifs8/image/upload/v1771318324/WhatsApp_Image_2026-02-17_at_2.18.34_PM_dpur0m.jpg">

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<h1 style="text-align:center;margin-top:50px;">Coordinator Hub</h1>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
/* ✅ SERVICE WORKER */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register("{% static 'service-worker.js' %}")
      .then(reg => console.log('✅ Service Worker Registered'))
      .catch(err => console.log('❌ Service Worker Failed', err));
  });
}

/* 🔥 INSTALL BUTTON */
let deferredPrompt;

window.addEventListener("beforeinstallprompt", (e) => {
  console.log("🔥 beforeinstallprompt fired");

  e.preventDefault();
  deferredPrompt = e;

  const installBtn = document.createElement("button");
  installBtn.innerText = "📲 Install App";
  installBtn.style.position = "fixed";
  installBtn.style.bottom = "20px";
  installBtn.style.right = "20px";
  installBtn.style.padding = "12px 18px";
  installBtn.style.background = "#3730A3";
  installBtn.style.color = "#fff";
  installBtn.style.border = "none";
  installBtn.style.borderRadius = "10px";
  installBtn.style.fontSize = "16px";
  installBtn.style.cursor = "pointer";
  installBtn.style.zIndex = "9999";

  document.body.appendChild(installBtn);

  installBtn.addEventListener("click", () => {
    deferredPrompt.prompt();

    deferredPrompt.userChoice.then((choiceResult) => {
      if (choiceResult.outcome === "accepted") {
        console.log("✅ User installed app");
      } else {
        console.log("❌ User dismissed install");
      }
      deferredPrompt = null;
    });
  });
});
</script>

</body>
</html>
